# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02) — tính bằng src/lab13.py
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48; 1.251 x 2,48 = 3.103 mỗi nhóm = 42 người mỗi nhóm, tổng 84 > 40 người: không đủ người
#   c) 20 nhân viên mỗi nhóm: tối đa 20 / 0,02 = 1.000 < 1.251: không đạt
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300 < 1.251: không đạt
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu mỗi người (DE = 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" (chia theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot.
#   2. Chia ngẫu nhiên: bốc thăm bằng code, seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp: nhân viên cùng depot có thể chia sẻ câu trả lời; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Viết trước: chỉ số chính, ngưỡng, luật dừng và ngày quyết định chốt trước ngày bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận: 20 nhân viên mỗi nhóm không đủ mẫu cho mức chênh 5 điểm (tối đa 1.000 < 1.251),
#   nên pilot chỉ đủ để thấy mức chênh 6 điểm (859 mỗi nhóm, m >= 299). Nếu tác động thật chỉ là 5 điểm,
#   power chỉ còn khoảng 0,64. Chọn cách này vì chia theo yêu cầu bị tràn tác động và chia theo depot chỉ có 6 cụm.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại: 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang là 3,97% (39/982).
#   Ngưỡng tuyệt đối 3% làm pilot dừng ngay tuần đầu, nên dùng chênh so với đối chứng +2 điểm kèm trần tuyệt đối 6%.

pilot:
  owner: "PM trợ lý hoàn phí"
  scope: "noi_dia + hang_nang (kết quả A3: 0,22x và 0,69x so với 12.000 đ); loại quoc_te và doi_tac; cả 12 depot, 40 nhân viên"
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # mức chênh 6 điểm đã chấp nhận, không phải 5 điểm
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # mẫu hiệu dụng; thực tế 20 người x 299 yêu cầu = 5.980 yêu cầu mỗi nhóm
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng chạy cùng tuần, cùng depot"
    spillover_risk: "Chia sẻ câu trả lời trong depot; giảm bằng quyền truy cập theo tài khoản, log lượt mở theo staff_id"
    predeclared: "Có: chỉ số chính, ngưỡng, luật dừng, ngày quyết định chốt trước ngày bắt đầu"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm can thiệp cao hơn đối chứng 2 điểm hoặc vượt 6% tuyệt đối TRONG 1 tuần THÌ PM trợ lý hoàn phí dừng pilot và chuyển toàn bộ yêu cầu về nhân viên KHÔNG THÌ không được tăng bước rollout"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ (đề xuất; 12.000 đ là baseline) hoặc tỉ lệ làm lại vượt 7% TRONG 1 tuần THÌ Trưởng nhóm CSKH thu hẹp pilot về noi_dia và rà 20 trace làm lại KHÔNG THÌ không mở lại hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa + bỏ) vượt 50% hoặc dưới 50% nhân viên can thiệp mở trợ lý TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí dừng tăng rollout và phỏng vấn nhân viên KHÔNG THÌ không tính tác động vào kết luận"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "PM trợ lý hoàn phí tắt cờ tính năng theo nhóm can thiệp trong 15 phút; khách được phục vụ bằng nhân viên theo quy trình cũ (6 phút mỗi yêu cầu)"
  decision_date: "Cuối tuần 4 tính từ ngày bắt đầu (3 bước rollout + 1 tuần phân tích), chốt trước khi bắt đầu"
  simulated_inputs: ["phut_xem_lai_simulated", "phut_lam_lai_simulated", "giá token, tool, 2.000 đ/phút, chi phí cố định 40 triệu đ/tháng", "ICC 0,02", "ngưỡng 8.000 đ, 7%, 50% là đề xuất"]
